<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width" initial-scale="1.0">
        <title>AZI MOMO</title>
        <link rel="stylesheet" href="momo.css">
    </head>

    <body>
        <header>
            <h1>AZI MoMo</h1>
            <nav>
                <a href="#">Home</a>
                <a href="#">Send Money</a>
                <a href="#">Receive Money</a>
                <a href="#">Transactions</a>
            </nav>
        </header>

        <main>
            <h2>Welcome to AZI MoMo</h2>
            <p>Manage your mobile money transactions easily.</p>

            <div class="balance">
                <h3>Available Balance</h3>
                <h1 id="balance">GHS 100.00</h1>
            </div>
            <div class="actions">
                <button id="sendMoneyBtn">Send Money</button>
                <button id="receiveMoneyBtn">Receive Money</button>
                <button id="historyBtn">Transaction History</button>
            </div>

            <div class="send-form" id="sendForm">
                <h2>Send Money</h2>
                <form id="moneyForm">
                    <label for="recipientName">Receive Name</label>
                    <input type="text" id="recipientName" placeholder="Enter recipient name">

                    <lebel>Phone Number</lebel>
                    <input type="tel" id="phoneNumber" placeholder="Enter phone number">

                    <lebel>Amount (GHS)</lebel>
                    <input type="number" id="amount" placeholder="Enter amount">
                    <button type="submit" id="continueBtn">Continue</button>
                </form>
                <p id="message"></p>
            </div>

            <div class="receive-form" id="receiveForm">
                <h2>Receive Money</h2>
                <form id="receiveMoneyForm">
                    <label>Sender Name</label>
                    <input type="text" id="senderName" placeholder="Enter sender name">

                    <label>Phone Number</label>
                    <input type="tel" id="senderPhone" placeholder="Enter phone number">

                    <label>Amount (GHS)</label>
                    <input type="number" id="receiveAmount" placeholder="Enter amount">
                    <button type="submit">Continue</button>
                </form>
                <p id="receiveMessage"></p>
            </div>
            <div class="history-section" id="historySection">
                <h2>Transaction History</h2>
                <button id="clearHistoryBtn">Clear History</button>
                <ul id="transactionList">
                </ul>
            </div>
        </main>

        <script src="script.js"></script>

    </body>
</html>
