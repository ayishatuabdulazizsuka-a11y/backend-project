<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Design</title>

    <link rel="stylesheet" href="welcome.css">

    
    <link rel="stylesheet" 
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

    <div class="container">

        <!-- LEFT CARD -->
        <div class="card welcome-card">

            <div class="shapes">
                <span class="circle circle1"></span>
                <span class="circle circle2"></span>
                <span class="circle circle3"></span>
                <span class="circle circle4"></span>
                <span class="circle circle5"></span>
            </div>

            <div class="welcome-content">
                <h1>Welcome Back!</h1>
                <p>
                    Enter personal details to<br>
                    your employee account
                </p>
            </div>

            <div class="welcome-bottom">
                <span>Sign in</span>
                <button>Sign up</button>
            </div>

        </div>


        <!-- MIDDLE CARD -->
        <div class="card form-card">

            <div class="top-design">
                <span class="circle top-circle1"></span>
                <span class="circle top-circle2"></span>
                <span class="circle top-circle3"></span>
            </div>

            <div class="form-box">

                <div class="back">
                    <i class="fa-solid fa-chevron-left"></i>
                    Back
                </div>

                <h2>Get Started</h2>

                <input type="text" placeholder="Full Name">
                <input type="email" placeholder="Email">
                <input type="password" placeholder="Password">

                <label class="check">
                    <input type="checkbox">
                    <span>I agree to the processing of <b>Personal data</b></span>
                </label>

                <button class="main-button">Sign up</button>

                <p class="social-title">Sign up with</p>

                <div class="social">
                    <i class="fa-brands fa-facebook"></i>
                    <i class="fa-brands fa-twitter"></i>
                    <i class="fa-brands fa-google"></i>
                    <i class="fa-brands fa-apple"></i>
                </div>

                <p class="account">
                    Already have an account?
                    <b>Sign in</b>
                </p>

            </div>
        </div>


        <!-- RIGHT CARD -->

                <span class="circle top-circle3"></span>
            </div>

                    <span>Forgot password?</span>
